name: CI/CD Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'front_despacho/**'

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: innovatech-eks
  NAMESPACE: innovatech
  DEPLOYMENT: frontend
  CONTAINER_NAME: frontend
  ECR_REPOSITORY: innovatech-frontend

jobs:
  deploy:
    name: Build, Push y Deploy Frontend a AWS EKS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar las credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push de imagen versionada
        id: build-image
        run: |
          IMAGE_TAG="${GITHUB_RUN_NUMBER}"
          REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          docker build --platform linux/amd64 \
            -t ${REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG} \
            -t ${REGISTRY}/${{ env.ECR_REPOSITORY }}:latest \
            ./front_despacho

          docker push ${REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}
          docker push ${REGISTRY}/${{ env.ECR_REPOSITORY }}:latest

          echo "image=${REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Configurar kubectl (CLI)
        uses: azure/setup-kubectl@v4

      - name: Configurar kubectl contra el cluster EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Actualizar la imagen del Deployment y esperar el rollout
        run: |
          kubectl set image deployment/${{ env.DEPLOYMENT }} \
            ${{ env.CONTAINER_NAME }}=${{ steps.build-image.outputs.image }} \
            -n ${{ env.NAMESPACE }}

          kubectl rollout status deployment/${{ env.DEPLOYMENT }} \
            -n ${{ env.NAMESPACE }} --timeout=180s
