server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend de Despachos (servicio interno del cluster,
    # solo alcanzable por DNS dentro de la red de Kubernetes). El
    # navegador del usuario llama a este mismo dominio publico
    # (/api/v1/despachos), y Nginx reenvia la peticion internamente.
    location /api/v1/despachos {
        proxy_pass http://despachos-service.innovatech.svc.cluster.local:8081/api/v1/despachos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy hacia el backend de Ventas (servicio interno del cluster).
    location /api/v1/ventas {
        proxy_pass http://ventas-service.innovatech.svc.cluster.local:8080/api/v1/ventas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
